name: Publish to npm

# Trusted publishing: no token in the repo. npm mints a short-lived credential
# from the GitHub OIDC token, and provenance is attached automatically.
# The trusted publisher must be configured on npmjs.com for this package first
# (package settings -> Trusted publishing -> GitHub Actions, this repo, this file).

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@{"message":"Not Found","documentation_url":"https://docs.github.com/rest/git/tags#get-a-tag","status":"404"} # v4
      - uses: actions/setup-node@{"message":"Not Found","documentation_url":"https://docs.github.com/rest/git/tags#get-a-tag","status":"404"} # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships older.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
